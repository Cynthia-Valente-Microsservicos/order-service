apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      initContainers:
        # Ajustado para testar o nome correto do serviço do Kafka
        - name: wait-for-kafka
          image: busybox
          command: ['sh', '-c', 'until nc -z kafka-service 9092; do sleep 2; done']
      containers:
        - name: order
          image: 730335608828.dkr.ecr.us-east-2.amazonaws.com/order:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /order/actuator/health
              port: 8080
            initialDelaySeconds: 45 # Aumentado um pouco para dar tempo do Java respirar
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /order/actuator/health
              port: 8080
            initialDelaySeconds: 75 # Aumentado para evitar que o K8s mate o pod no susto
            periodSeconds: 15
            failureThreshold: 3
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: EUREKA_CLIENT_ENABLED
              value: "false"
            
            # 🌟 CORREÇÃO DO BYPASS: Força o Spring a ignorar a falta do Bean do Kafka
            - name: SPRING_AUTOCONFIGURE_EXCLUDE
              value: "org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration"

            # Fiação dupla do Kafka (com kafka e kafka-service) para não ter erro
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"

            # Configurações do Banco de Dados Postgres (Mantidas idênticas)
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: database-host
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_DB
              value: "postgres"
            - name: DATABASE_USERNAME
              value: "store"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: database-password
---
apiVersion: v1
kind: Service
metadata:
  name: order
spec:
  selector:
    app: order
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: LoadBalancer