apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox
          command: ['sh', '-c', 'until nc -z kafka-service 9092; do echo "aguardando kafka..."; sleep 3; done']
      containers:
        - name: order
          image: 730335608828.dkr.ecr.us-east-2.amazonaws.com/order:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          
          # 🌟 Devolvendo recursos pro Java trabalhar em paz
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: EUREKA_CLIENT_ENABLED
              value: "false"

            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"

            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: database-host
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_DB
              value: "postgres"
            - name: DATABASE_USERNAME
              value: "store"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: database-password
---
apiVersion: v1
kind: Service
metadata:
  name: order
spec:
  selector:
    app: order
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: LoadBalancer