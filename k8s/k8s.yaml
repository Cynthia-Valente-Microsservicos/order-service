apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: 730335608828.dkr.ecr.us-east-2.amazonaws.com/order-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          
          resources:
            requests:
              memory: "180Mi"
              cpu: "100m"
            limits:
              memory: "350Mi"
              cpu: "300m"
          
          env:
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: database-host
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_DB
              value: "postgres"
            - name: DATABASE_USERNAME
              value: "store"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: database-password
            
            - name: KAFKA_HOST
              value: "kafka-service:9092"

---

apiVersion: v1
kind: Service
metadata:
  name: order
spec:
  selector:
    app: order
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: LoadBalancer